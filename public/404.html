<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<title>Not found — Nicholas Kimball</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Static page served by CloudFront for any missing path. Mirrors the site's tokens in index.css. */
  :root { --ink:#08080a; --line:#232329; --text:#ededee; --muted:#8b8b93; --faint:#77777f; --accent:#e5a54b; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:2rem 1.5rem;
    background:var(--ink); color:var(--text);
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main { max-width:40rem; width:100%; }
  .eyebrow {
    font-family:"JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size:.6875rem; letter-spacing:.18em; text-transform:uppercase; color:var(--faint);
    margin:0 0 1.75rem;
  }
  .eyebrow b { color:var(--accent); font-weight:400; }
  h1 { font-size:clamp(2.5rem,8vw,5rem); font-weight:300; line-height:.95; letter-spacing:-.04em; margin:0 0 1.5rem; }
  p { color:var(--muted); font-size:1.0625rem; line-height:1.65; margin:0 0 2.25rem; max-width:32rem; }
  a.home {
    display:inline-block; padding:.75rem 1.5rem; border-radius:9999px;
    background:var(--text); color:var(--ink); text-decoration:none; font-size:.9375rem; font-weight:500;
  }
  a.home:hover { opacity:.85; }
  a.alt { margin-left:1.25rem; color:var(--muted); font-size:.9375rem; text-decoration:none; border-bottom:1px solid var(--line); }
  a.alt:hover { color:var(--text); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow"><b>404</b> / Not found</p>
  <h1>Nothing at<br>this address.</h1>
  <p>The page may have moved, or the link was mistyped. Everything on this site is one level deep, so the home page is never far.</p>
  <a class="home" href="/">Back to the site</a>
  <a class="alt" href="/#work">Or jump to the work</a>
</main>
</body>
</html>
